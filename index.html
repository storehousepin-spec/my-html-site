<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: 手繪餐桌插圖置頂的框線畫框，下方橘色分頁(縣市)、單欄大卡片，全部用橘色細框線界定 */
:root{
  --bg:#FFF9EC; --surface:#FFFFFF; --ink:#2E1F15; --muted:#7B6554; --line:#F2D6BA; --edge:#E5A56B; --soft:#FFEAD4; --paper:#F4ECE2;
  --sign:#C95A08; --sign-ink:#FFFFFF; --stamp:#B84A06; --focus:#1B6FD1; --warn:#9A5B00;
  color-scheme:light;
  --font-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-block:12px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* header */
.hero{margin:0; border:2px solid var(--edge); border-radius:16px; overflow:hidden; background:var(--paper)}
.hero img{display:block; width:100%; height:auto}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 2px}
.logo{font-family:var(--font-display); font-weight:900; font-size:34px; line-height:1.1; letter-spacing:.06em; margin:0; color:var(--sign)}
.tag{margin:6px 0 0; color:var(--muted)}
.stats{text-align:right; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; margin:0}
.stats b{color:var(--ink); font-weight:700}

/* add panel */
.add{background:var(--surface); border:1.5px solid var(--edge); border-radius:14px; min-width:0}
.add>summary{list-style:none; cursor:pointer; padding:14px 16px; font-weight:700; color:var(--sign); display:flex; justify-content:space-between; align-items:center; border-radius:12px; min-height:48px}
.add>summary::-webkit-details-marker{display:none}
.add>summary::after{content:"＋"; font-size:20px; line-height:1}
.add[open]>summary::after{content:"－"}
.add[open]>summary{border-bottom:1.5px dashed var(--line); border-radius:12px 12px 0 0}
.add-body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px}
.add label{font-weight:700}
#paste{width:100%; min-height:112px; resize:vertical; padding:12px; border:1.5px solid var(--edge); border-radius:10px; background:var(--bg); line-height:1.6}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px}
.btn{border:1.5px solid var(--edge); background:var(--surface); padding:8px 16px; border-radius:10px; cursor:pointer; min-height:40px}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign); color:var(--sign-ink); border-color:var(--sign); font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6; cursor:progress}
.btn.danger{color:var(--stamp); border-color:var(--stamp)}
.hint{color:var(--muted); font-size:13px; margin:0}
#status{min-height:1.6em; margin:0; font-size:14px}
#status.warn{color:var(--warn)}

/* filters */
.filters{display:flex; flex-direction:column; gap:14px; min-width:0}
.search{width:100%; padding:11px 14px; border:1.5px solid var(--edge); border-radius:12px; background:var(--surface)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips-label{font-size:12px; letter-spacing:.12em; color:var(--muted); margin:0 0 6px}
.chip{border:1.5px solid var(--edge); background:var(--surface); padding:6px 14px; border-radius:999px; cursor:pointer; font-weight:500; font-size:14px}
.chip .n{color:var(--muted); font-variant-numeric:tabular-nums; margin-left:6px; font-weight:400}
.chip[aria-pressed="true"]{background:var(--sign); color:var(--sign-ink); border-color:var(--sign)}
.chip[aria-pressed="true"] .n{color:inherit; opacity:.85}
.chip.sm{padding:4px 12px; font-size:13px}

/* tabs */
.tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:1.5px solid var(--edge); background:var(--surface); padding:9px 16px; border-radius:12px; cursor:pointer; font-weight:500; color:var(--ink); white-space:nowrap; min-height:44px}
.tab .n{margin-left:6px; font-size:12px; font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--sign)}
.tab[aria-selected="true"]{background:var(--sign); border-color:var(--sign); color:var(--sign-ink); font-weight:700}
.need{display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--soft); border:1.5px dashed var(--edge); border-radius:10px; padding:6px 10px; font-size:13px; color:var(--muted)}
.need button{border:0; background:none; color:var(--sign); font-weight:700; cursor:pointer; padding:0; text-decoration:underline}
/* results */
#list{display:flex; flex-direction:column; gap:28px}
.city{display:flex; flex-direction:column; gap:16px}
.sign{display:inline-flex; align-items:baseline; gap:12px; align-self:flex-start; background:var(--sign); color:var(--sign-ink); padding:8px 18px; border-radius:12px; box-shadow:inset 0 0 0 3px var(--sign), inset 0 0 0 4.5px rgba(255,255,255,.85)}
.sign h2{margin:0; font-size:20px; font-weight:700; letter-spacing:.06em}
.sign span{font-size:13px; opacity:.9; font-variant-numeric:tabular-nums}
.dist{display:flex; flex-direction:column; gap:10px}
.dist h3{margin:0; font-size:14px; font-weight:700; color:var(--sign); display:flex; align-items:center; gap:10px; letter-spacing:.08em}
.dist h3::after{content:""; flex:1; height:1.5px; background:var(--line)}
.grid{display:grid; grid-template-columns:1fr; gap:12px}
.card{background:var(--surface); border:1.5px solid var(--edge); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.card.fresh{border-color:var(--sign); box-shadow:0 0 0 2px var(--sign)}
.card-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.stamp{border:1.5px solid var(--stamp); color:var(--stamp); font-size:12px; font-weight:700; letter-spacing:.15em; padding:0 8px 0 10px; border-radius:999px; line-height:1.7}
.stars{color:var(--stamp); letter-spacing:.1em; font-size:13px}
.card h4{margin:0; font-size:19px; line-height:1.35; overflow-wrap:anywhere}
.rec{margin:0; overflow-wrap:anywhere}
.rec b{color:var(--sign); font-weight:700; margin-right:6px; font-size:13px; letter-spacing:.1em}
.addr{margin:0; color:var(--muted); font-size:13px; overflow-wrap:anywhere}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tags span{background:var(--soft); border:1px solid var(--line); color:var(--muted); font-size:12px; padding:0 10px; border-radius:999px}
.card-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:10px; border-top:1.5px dashed var(--line)}
.price{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
.acts{display:flex; gap:8px; margin-left:auto}
.ico{display:inline-flex; align-items:center; justify-content:center; gap:4px; height:40px; min-width:40px; padding:0 12px; border:1.5px solid var(--edge); border-radius:10px; background:var(--surface); color:var(--ink); text-decoration:none; cursor:pointer; font-size:13px}
.ico:hover{border-color:var(--sign)}
.ico svg{display:block}

/* empty */
.empty{border:1.5px dashed var(--edge); border-radius:14px; padding:32px 20px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:10px}
.empty strong{color:var(--ink); font-size:17px}
.empty p{margin:0; max-width:46ch}

/* dialog */
dialog{border:2px solid var(--edge); border-radius:16px; background:var(--surface); color:var(--ink); padding:0; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px; display:flex; flex-direction:column; gap:12px}
.dlg h2{margin:0; font-size:19px}
.fld{display:flex; flex-direction:column; gap:4px; min-width:0}
.fld span{font-size:13px; color:var(--muted)}
.fld input,.fld select{padding:9px 10px; border:1.5px solid var(--edge); border-radius:10px; background:var(--bg); min-width:0; width:100%}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dlg-foot{display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; margin-top:4px}
@media (max-width:420px){ .two{grid-template-columns:1fr} }
@media (min-width:640px){ .grid{grid-template-columns:1fr 1fr} .logo{font-size:40px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
.ico.eat{gap:6px}
.ico.eat[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:700}
.card.eaten{background:#FFF4E2}
.view{display:flex;flex-direction:column;gap:18px}.view[hidden]{display:none}
.bk{border:1.5px solid var(--edge);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.bk h2{margin:0;font-size:18px;color:var(--sign)}
.bk textarea{width:100%;min-height:120px;padding:10px;border:1.5px solid var(--edge);border-radius:10px;background:var(--bg);font-family:ui-monospace,Menlo,monospace;font-size:13px}
.sel{width:100%;padding:10px;border:1.5px solid var(--edge);border-radius:10px;background:var(--surface);min-height:44px}
.sel-l{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
#bkMsg{min-height:1.6em;margin:0;font-size:14px}#bkMsg.warn{color:var(--warn)}
</style>

  <header class="top">
    <div>
      <h1 class="logo">食藏</h1>
    </div>
    <p class="stats" id="stats" aria-live="polite"></p>
  </header>

  <nav class="grid grid-cols-2 gap-2" id="mainTabs" role="tablist" aria-label="分頁">
    <button type="button" class="tab" role="tab" aria-selected="true" data-view="food"><i class="fa-solid fa-bowl-rice mr-1"></i>美食收藏</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-view="backup"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>備份</button>
  </nav>

  <div class="view" id="viewFood">
  <details class="add" id="addBox" open>
    <summary><span><i class="fa-solid fa-circle-plus mr-2"></i>新增店家</span></summary>
    <div class="add-body">
    <label id="paste-label" for="paste">貼上食記網址、YouTube 影片、Google 地圖連結或店名</label>
<textarea id="paste"></textarea>
    <div class="row">
      <button class="btn primary" id="go" type="button"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>自動收納</button>
      <span class="hint" id="mode"></span>
    </div>
    <p id="status" role="status"></p>
    </div>
  </details>

  <section class="filters" id="filters" hidden aria-label="篩選">
    <input class="search" id="q" type="search" placeholder="搜尋店名、菜色、地址" aria-label="搜尋">
    <div class="grid grid-cols-2 gap-2">
      <label class="sel-l">縣市<select class="sel" id="selCity"></select></label>
      <label class="sel-l">區域<select class="sel" id="selDist"></select></label>
      <label class="sel-l">類別<select class="sel" id="selCat"></select></label>
      <label class="sel-l">吃過了嗎<select class="sel" id="selEat"></select></label>
    </div>
  </section>

  <main id="list"></main>
  <div class="empty" id="empty">
    <strong>還沒有收藏</strong>
    <p>把店家資訊貼到上面，按「自動收納」。每間店會依縣市、區域分類，並附上 Google 地圖圖示和推薦菜色。</p>
  </div>
</div>

  <div class="view" id="viewBackup" hidden>
    <section class="bk">
      <h2><i class="fa-solid fa-file-export mr-2"></i>匯出備份</h2>
      <div class="flex flex-wrap gap-2">
        <button class="btn primary" id="bkDl" type="button"><i class="fa-solid fa-download mr-1"></i>下載 JSON</button>
        <button class="btn" id="bkCopy" type="button"><i class="fa-solid fa-copy mr-1"></i>複製 JSON 文字</button>
      </div>
    </section>
    <section class="bk">
      <h2><i class="fa-solid fa-file-import mr-2"></i>還原備份</h2>
      <div class="flex flex-col gap-2" role="radiogroup" aria-label="還原方式">
        <label class="flex items-center gap-2"><input type="radio" name="rmode" value="merge" checked><span><b>合併</b>（保留現有）</span></label>
        <label class="flex items-center gap-2"><input type="radio" name="rmode" value="replace"><span><b>覆蓋</b>（取代現有）</span></label>
      </div>
      <label class="btn cursor-pointer inline-flex items-center justify-center"><i class="fa-solid fa-folder-open mr-1"></i>選擇備份檔案<input type="file" id="bkFile" accept=".json,application/json" hidden></label>
      <label class="sel-l" for="bkPaste">貼上 JSON 文字</label>
      <textarea id="bkPaste" spellcheck="false"></textarea>
      <button class="btn primary" id="bkPasteGo" type="button"><i class="fa-solid fa-clipboard-check mr-1"></i>貼上還原</button>
      <p id="bkMsg" role="status"></p>
    </section>
  </div>
</div>

<dialog id="dlg">
  <form class="dlg" id="editForm" method="dialog">
    <h2>編輯店家</h2>
    <label class="fld"><span>店名</span><input id="f-name" required maxlength="40"></label>
    <div class="two">
      <label class="fld"><span>縣市</span><select id="f-city"></select></label>
      <label class="fld"><span>區域</span><input id="f-district" maxlength="12" placeholder="例：大安區"></label>
    </div>
    <div class="two">
      <label class="fld"><span>類別</span><select id="f-cat"></select></label>
      <label class="fld"><span>評分</span><select id="f-rating"></select></label>
    </div>
    <label class="fld"><span>地址（貼上 Google 地圖的地址，縣市和區域會自動填入）</span><input id="f-address" maxlength="120"></label>
    <label class="fld"><span>食記／影片連結</span><input id="f-url" type="text" inputmode="url" maxlength="500" placeholder="https://"></label>
    <label class="fld"><span>推薦菜色或亮點</span><input id="f-rec" maxlength="80"></label>
    <div class="two">
      <label class="fld"><span>價位</span><input id="f-price" maxlength="20" placeholder="例：NT$150"></label>
      <label class="fld"><span>標籤（用逗號分隔）</span><input id="f-tags" maxlength="40"></label>
    </div>
    <div class="dlg-foot">
      <button class="btn danger" type="button" id="del"><i class="fa-solid fa-trash mr-1"></i>刪除</button>
      <span class="row">
        <button class="btn" type="button" id="cancel">取消</button>
        <button class="btn primary" type="submit" id="save">儲存</button>
      </span>
    </div>
  </form>
</dialog>

var ui={city:'',district:'',cat:'',q:''};
var freshIds={};
var editingId=null;
var addTouched=false;

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function str(v){return v==null?'':String(v).trim()}
function norm(s){return String(s).replace(/台/g,'臺')}
function newId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function normCity(v){
  var s=norm(str(v));
  if(!s)return '';
  if(CITIES.indexOf(s)>-1)return s;
  if(s.length<2)return '';
  for(var i=0;i<CITIES.length;i++){ if(CITIES[i].slice(0,2)===s.slice(0,2))return CITIES[i]; }
  return '';
}
function guessCat(t){
  for(var i=0;i<KEYS.length;i++){ if(KEYS[i][1].test(t))return KEYS[i][0]; }
  return '小吃';
}
function mapUrl(f){
  if(f.mapLink&&!f.address)return f.mapLink;
  var q=f.address?(f.name+' '+f.address):[f.name,f.city,f.district].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}
function httpOnly(v){v=str(v);return /^https?:\/\//i.test(v)?v.slice(0,500):''}
function clean(o){var x=clean0(o);if(o&&o.url!==undefined)x.url=httpOnly(o.url);if(o&&o.img!==undefined)x.img=httpOnly(o.img);if(o&&o.mapLink!==undefined)x.mapLink=httpOnly(o.mapLink);if(o&&o.eaten!==undefined)x.eaten=!!o.eaten;return x}
function clean0(o){
  o=o||{};
  var r=parseInt(o.rating,10); if(!(r>=0))r=0; if(r>5)r=5;
  var tags=Array.isArray(o.tags)?o.tags:(typeof o.tags==='string'?o.tags.split(/[,，、]/):[]);
  return {
    name:str(o.name).slice(0,40),
    city:normCity(o.city),
    district:str(o.district).slice(0,12),
    category:CATS.indexOf(o.category)>-1?o.category:'其他',
    address:str(o.address).slice(0,120),
    recommend:str(o.recommend).slice(0,80),
    price:str(o.price).slice(0,20),
    rating:r,
    tags:tags.map(str).filter(Boolean).slice(0,3)
  };
}

/* ---------- local fallback parser ---------- */
function splitBlocks(text){
  var parts=text.split(/\n\s*\n|\n(?=\s*(?:\d+[.、)）]|[•・▪●★⭐]|[-－]\s))/);
  return parts.map(function(s){return s.trim()}).filter(Boolean);
}
function localParseBlock(block){
  var n=norm(block), city='', cityIdx=-1, i;
  for(i=0;i<CITIES.length;i++){ var k=n.indexOf(CITIES[i]); if(k>-1){city=CITIES[i]; cityIdx=k; break;} }
  var district='';
  if(city){
    var m=n.slice(cityIdx+city.length).match(/^[\s,，、\-－]*([一-龥]{1,3}?[區鄉鎮市])/);
    if(m)district=m[1];
  }
  var name='';
  var mm=block.match(/maps\/place\/([^\/?#]+)/);
  if(mm){ try{name=decodeURIComponent(mm[1].replace(/\+/g,' '))}catch(e){} }
  if(!name){ var br=block.match(/[【\[「『]([^】\]」』]{1,30})[】\]」』]/); if(br)name=br[1]; }
  if(!name){
    var line=block.split('\n').map(function(s){return s.trim()}).filter(function(s){return s&&!/^https?:/i.test(s)})[0]||'';
    line=line.replace(/^[\d.、)）\-－•・▪●★⭐\s]+/,'');
    var ci=norm(line).indexOf(city);
    if(city&&ci>0)line=line.slice(0,ci);
    name=line.split(/[\s,，、:：｜|]/)[0];
  }
  name=str(name).slice(0,20)||'未命名店家';
  var addr='';
  if(city){ var am=n.slice(cityIdx).match(/^[^\n，,。；;]{4,60}?\d+[一-龥\d\-之]*[號号]/); if(am)addr=am[0]; }
  var rec=''; var rm=block.match(/(?:推薦|必點|招牌)[:：]?\s*([^\n]+)/); if(rm)rec=rm[1].replace(/人均.*$/,'').replace(/NT\$?\s?\d+(?:[-~～]\d+)?|\d+\s?元/gi,'').trim();
  var price=''; var pm=block.match(/NT\$?\s?\d+(?:[-~～]\d+)?|\d+\s?元|人均\s?\d+/i); if(pm)price=pm[0];
  var stars=(block.match(/[★⭐]/g)||[]).length; if(stars>5)stars=0;
  return {name:name,city:city,district:district,category:guessCat(block),address:addr,recommend:rec,price:price,rating:stars,tags:[]};
}
function localParse(text){ return splitBlocks(text).map(localParseBlock); }

/* ---------- storage ---------- */
function loadLocal(){
  try{ var raw=localStorage.getItem(LS_KEY); foods=raw?JSON.parse(raw):[]; if(!Array.isArray(foods))foods=[]; }catch(e){foods=[]}
}
function saveLocal(){ try{localStorage.setItem(LS_KEY,JSON.stringify(foods))}catch(e){ setStatus('儲存空間不足，請先匯出備份。',true) } }
async function commit(item){
  var i=foods.findIndex(function(f){return f.id===item.id});
  if(i>-1)foods[i]=item; else foods.unshift(item);
  saveLocal(); render();
  return true;
}
async function removeItem(id){ foods=foods.filter(function(f){return f.id!==id}); saveLocal(); render(); }

/* ---------- ingest (純前端：公開 oEmbed / 預覽服務 + 本機規則) ---------- */
function setStatus(msg,warn){ var s=$('status'); s.textContent=msg||''; s.className=warn?'warn':''; }
function setMode(){}
var URL_RE=/https?:\/\/[^\s<>"']+/g;
function isMaps(u){ return /google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(u); }
function tfetch(u,ms){ var c=new AbortController(), t=setTimeout(function(){c.abort()},ms); return fetch(u,{signal:c.signal}).finally(function(){clearTimeout(t)}); }
function cleanTitle(t){
  t=String(t||'').replace(/\s*[-–—|｜_]\s*(YouTube|Facebook|Instagram|痞客邦|PIXNET|方格子|Google 地圖|Google Maps).*$/i,'');
  var parts=t.replace(/【[^】]*】|\[[^\]]*\]|[「」]/g,'|').split(/[|｜\-–—_：:\n]/).map(function(s){return s.replace(/^[\s#@]+|\s+$/g,'')}).filter(function(s){return s.length>=2});
  return str(parts.filter(function(s){return s.length<=16})[0]||parts[0]||t).slice(0,30);
}
async function fetchMeta(u){
  var m={title:'',desc:'',img:''};
  if(/youtu\.?be/i.test(u)){
    try{ var r=await tfetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u),8000); var d=await r.json(); m.title=d.title||''; m.img=d.thumbnail_url||''; }catch(e){}
  }
  try{
    var r2=await tfetch('https://api.microlink.io/?url='+encodeURIComponent(u),10000); var j=await r2.json(), d2=(j&&j.data)||{};
    if(!m.title)m.title=d2.title||''; m.desc=d2.description||''; if(!m.img&&d2.image&&d2.image.url)m.img=d2.image.url;
  }catch(e){}
  return m;
}
async function parseOne(block){
  var urls=block.match(URL_RE)||[], own=block.replace(URL_RE,' ').trim(), src='', mapLink='', meta=null, failed=false;
  for(var i=0;i<urls.length;i++){
    var u=urls[i].replace(/[)）、，。]+$/,'');
    if(isMaps(u)){ mapLink=mapLink||u; continue; }
    if(!src){ src=u; meta=await fetchMeta(u); if(!meta.title&&!meta.desc)failed=true; }
  }
  var it=localParseBlock(block+(meta?'\n'+meta.title+'\n'+meta.desc:''));
  if(meta&&meta.title&&!own&&!/maps\/place\//.test(block))it.name=cleanTitle(meta.title)||it.name;
  if(src)it.url=src; if(mapLink)it.mapLink=mapLink; if(meta&&meta.img)it.img=meta.img;
  return {item:it,failed:failed};
}
async function ingest(){
  var text=$('paste').value.trim();
  if(!text){ setStatus('請先貼上網址或店家資訊。',true); return; }
  var btn=$('go'); btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1"></i>解析中…'; setStatus('');
  var blocks=splitBlocks(text).slice(0,20), items=[], fails=0;
  try{
    for(var b=0;b<blocks.length;b++){ var r=await parseOne(blocks[b]); items.push(r.item); if(r.failed)fails++; }
  }catch(e){ items=localParse(text); }
  var note=fails?('有 '+fails+' 個網址讀不到內容（該網站可能擋讀取），請把內文或地址貼上。'):'';
  var cleaned=items.map(clean).filter(function(x){return x.name});
  var added=[], dup=0, keys={};
  foods.forEach(function(f){ keys[f.name+'|'+f.district]=1; });
  for(var i=0;i<cleaned.length;i++){
    var it=cleaned[i], key=it.name+'|'+it.district;
    if(keys[key]){dup++; continue;}
    keys[key]=1;
    it.id=newId(); it.createdAt=Date.now()+i;
    await commit(it); added.push(it);
  }
  btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles mr-1"></i>自動收納';
  if(added.length){
    freshIds={}; added.forEach(function(a){freshIds[a.id]=1});
    var cs={}; added.forEach(function(a){cs[a.city||'未分類']=1});
    var ck=Object.keys(cs);
    ui={city:ck.length===1?ck[0]:'',district:'',cat:'',q:''}; $('q').value='';
    $('paste').value='';
    var names=added.slice(0,3).map(function(a){return a.name}).join('、');
    var miss=added.filter(function(a){return !a.city}).length;
    var msg='已收納 '+added.length+' 間：'+names+(added.length>3?' 等':'')+'。';
    if(dup)msg+=' 另有 '+dup+' 間已收藏過。';
    if(miss)msg+=' 有 '+miss+' 間判斷不出縣市，已放在「未分類」，可按編輯補上。';
    if(note)msg+=' '+note;
    setStatus(msg,!!(miss||note));
    render();
  }else{
    setStatus(dup?('這 '+dup+' 間店已經收藏過了。'):(note||'沒有找到店家資訊，請補上店名後再試。'),true);
  }
}

/* ---------- render ---------- */
function chip(label,count,pressed,attrs,cls){
  return '<button type="button" class="chip'+(cls?' '+cls:'')+'" aria-pressed="'+(pressed?'true':'false')+'" '+attrs+'>'+esc(label)+(count!=null?'<span class="n">'+count+'</span>':'')+'</button>';
}
function stars(r){ return r>0?'<span class="stars" role="img" aria-label="評分 '+r+' 顆星">'+'★'.repeat(r)+'☆'.repeat(5-r)+'</span>':'<span></span>'; }
var PIN='<i class="fa-solid fa-location-dot" style="color:#EA4335;font-size:20px" aria-hidden="true"></i>';

function cardHtml(f){
  var h='<article class="card'+(freshIds[f.id]?' fresh':'')+(f.eaten?' eaten':'')+'">';
  h+='<div class="card-top"><span class="stamp">'+esc(f.category||'其他')+'</span>'+stars(f.rating||0)+'</div>';
  if(f.img)h+='<img class="w-full h-36 object-cover rounded-lg" style="border:1.5px solid var(--line)" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" src="'+esc(f.img)+'">';
  h+='<h4>'+esc(f.name)+'</h4>';
  if(f.recommend)h+='<p class="rec"><b>推薦</b>'+esc(f.recommend)+'</p>';
  if(f.address)h+='<p class="addr">'+esc(f.address)+'</p>';
  if(!f.city)h+='<p class="need">尚未判斷縣市與地點 <button type="button" data-edit="'+esc(f.id)+'">補上資訊</button></p>';
  if(f.tags&&f.tags.length)h+='<div class="tags">'+f.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>';
  h+='<div class="card-foot"><span class="price">'+esc(f.price||'')+'</span><div class="acts">';
  h+='<button type="button" class="ico eat" data-eat="'+esc(f.id)+'" aria-pressed="'+(f.eaten?'true':'false')+'" title="點一下切換已吃／還未吃"><i class="fa-solid '+(f.eaten?'fa-circle-check':'fa-utensils')+'" aria-hidden="true"></i>'+(f.eaten?'已吃':'還未吃')+'</button>';
  h+='<a class="ico" href="'+esc(mapUrl(f))+'" target="_blank" rel="noopener noreferrer" title="在 Google 地圖開啟" aria-label="在 Google 地圖開啟 '+esc(f.name)+'">'+PIN+'</a>';
  if(f.url)h+='<a class="ico" href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer" title="開啟食記／影片" aria-label="開啟食記或影片"><i class="fa-solid fa-book-open" aria-hidden="true"></i></a>';
  h+='<button type="button" class="ico" data-edit="'+esc(f.id)+'" aria-label="編輯 '+esc(f.name)+'"><i class="fa-solid fa-pen" aria-hidden="true"></i>編輯</button>';
  h+='</div></div></article>';
  return h;
}

function render(){
  var has=foods.length>0;
  if(has&&!addTouched){ addTouched=true; $('addBox').open=false; }
  $('empty').hidden=has; $('filters').hidden=!has;
  var cities={}; foods.forEach(function(f){ var c=f.city||'未分類'; cities[c]=(cities[c]||0)+1; });
  $('stats').innerHTML=has?'共 <b>'+foods.length+'</b> 間，已吃 <b>'+foods.filter(function(f){return f.eaten}).length+'</b> 間，<b>'+Object.keys(cities).length+'</b> 個縣市':'';
  if(!has){ $('list').innerHTML=''; return; }

  var order=CITIES.concat(['未分類']);
  if(ui.city&&!cities[ui.city]){ ui.city=''; ui.district=''; }
  function opt(v,l,sel){ return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>'; }
  var h=opt('','全部縣市（'+foods.length+'）',!ui.city);
  order.forEach(function(c){ if(cities[c])h+=opt(c,c+'（'+cities[c]+'）',ui.city===c); });
  $('selCity').innerHTML=h;
  var dists={}; foods.forEach(function(f){ if(!ui.city||(f.city||'未分類')===ui.city){ var d=f.district||'未標區域'; dists[d]=(dists[d]||0)+1; } });
  if(ui.district&&!dists[ui.district])ui.district='';
  h=opt('','全部區域',!ui.district);
  Object.keys(dists).sort(function(a,b){return a.localeCompare(b,'zh-Hant')}).forEach(function(d){ h+=opt(d,d+'（'+dists[d]+'）',ui.district===d); });
  $('selDist').innerHTML=h;
  var cats={}; foods.forEach(function(f){ var c=f.category||'其他'; cats[c]=(cats[c]||0)+1; });
  h=opt('','全部類別',!ui.cat);
  CATS.forEach(function(c){ if(cats[c])h+=opt(c,c+'（'+cats[c]+'）',ui.cat===c); });
  $('selCat').innerHTML=h;
  var ne=foods.filter(function(f){return f.eaten}).length;
  $('selEat').innerHTML=opt('','全部',!ui.eat)+opt('no','還未吃（'+(foods.length-ne)+'）',ui.eat==='no')+opt('yes','已吃（'+ne+'）',ui.eat==='yes');

  var q=norm(ui.q.toLowerCase());
  var list=foods.filter(function(f){
    var c=f.city||'未分類', d=f.district||'未標區域';
    if(ui.city&&c!==ui.city)return false;
    if(ui.district&&d!==ui.district)return false;
    if(ui.cat&&(f.category||'其他')!==ui.cat)return false;
    if(ui.eat==='yes'&&!f.eaten)return false;
    if(ui.eat==='no'&&f.eaten)return false;
    if(q){ var hay=norm([f.name,f.recommend,f.address,f.city,f.district,f.category,(f.tags||[]).join(' ')].join(' ').toLowerCase()); if(hay.indexOf(q)<0)return false; }
    return true;
  });
  if(!list.length){ $('list').innerHTML='<div class="empty"><strong>沒有符合的店家</strong><p>換個關鍵字，或把篩選改回「全部」。</p></div>'; return; }

  var out='';
  order.forEach(function(c){
    var inCity=list.filter(function(f){return (f.city||'未分類')===c});
    if(!inCity.length)return;
    var byD={}; inCity.forEach(function(f){ var d=f.district||'未標區域'; (byD[d]=byD[d]||[]).push(f); });
    out+='<section class="city"><div class="sign"><h2>'+esc(c)+'</h2><span>'+inCity.length+' 間</span></div>';
    Object.keys(byD).sort(function(a,b){ return byD[b].length-byD[a].length||a.localeCompare(b,'zh-Hant'); }).forEach(function(d){
      var arr=byD[d].sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
      out+='<div class="dist"><h3>'+esc(d)+' · '+arr.length+'</h3><div class="grid">'+arr.map(cardHtml).join('')+'</div></div>';
    });
    out+='</section>';
  });
  $('list').innerHTML=out;
}

/* ---------- edit dialog ---------- */
function fillSelect(el,opts,val){ el.innerHTML=opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join(''); }
function openEdit(id){
  var f=foods.find(function(x){return x.id===id}); if(!f)return;
  editingId=id;
  $('f-name').value=f.name||'';
  fillSelect($('f-city'),[['','未分類']].concat(CITIES.map(function(c){return [c,c]})),f.city||'');
  $('f-district').value=f.district||'';
  fillSelect($('f-cat'),CATS.map(function(c){return [c,c]}),f.category||'其他');
  fillSelect($('f-rating'),[['0','未評分'],['1','1 顆星'],['2','2 顆星'],['3','3 顆星'],['4','4 顆星'],['5','5 顆星']],String(f.rating||0));
  $('f-address').value=f.address||'';
  $('f-rec').value=f.recommend||'';
  $('f-price').value=f.price||''; $('f-url').value=f.url||'';
  $('f-tags').value=(f.tags||[]).join('，');
  var d=$('del'); d.innerHTML='<i class="fa-solid fa-trash mr-1"></i>刪除'; d.dataset.armed='';
  var dlg=$('dlg'); if(dlg.showModal)dlg.showModal(); else dlg.setAttribute('open','');
}
function closeEdit(){ var dlg=$('dlg'); if(dlg.close)dlg.close(); else dlg.removeAttribute('open'); editingId=null; }

/* ---------- events ---------- */
$('addBox').querySelector('summary').addEventListener('click',function(){ addTouched=true; });
$('go').addEventListener('click',ingest);
$('paste').addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); ingest(); } });
$('q').addEventListener('input',function(e){ ui.q=e.target.value; render(); });
$('selCity').addEventListener('change',function(e){ ui.city=e.target.value; ui.district=''; freshIds={}; render(); });
$('selDist').addEventListener('change',function(e){ ui.district=e.target.value; freshIds={}; render(); });
$('selCat').addEventListener('change',function(e){ ui.cat=e.target.value; freshIds={}; render(); });
$('selEat').addEventListener('change',function(e){ ui.eat=e.target.value; freshIds={}; render(); });
document.querySelectorAll('#mainTabs [data-view]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.getAttribute('data-view');
    $('viewFood').hidden=v!=='food'; $('viewBackup').hidden=v!=='backup';
    document.querySelectorAll('#mainTabs [data-view]').forEach(function(x){ x.setAttribute('aria-selected',x===b?'true':'false'); });
    window.scrollTo(0,0);
  });
});
$('list').addEventListener('click',function(e){
  var t=e.target.closest('[data-eat]');
  if(t){ var f=foods.find(function(x){return x.id===t.getAttribute('data-eat')}); if(f){ f.eaten=!f.eaten; freshIds={}; saveLocal(); render(); } return; }
  var b=e.target.closest('[data-edit]'); if(b)openEdit(b.getAttribute('data-edit'));
});
$('cancel').addEventListener('click',closeEdit);
$('f-address').addEventListener('input',function(){
  var t=norm($('f-address').value), c='';
  for(var i=0;i<CITIES.length;i++){ if(t.indexOf(CITIES[i])>-1){c=CITIES[i];break;} }
  if(!c)return;
  $('f-city').value=c;
  var m=t.slice(t.indexOf(c)+c.length).match(/^\s*([\u4e00-\u9fa5]{1,3}?[區鄉鎮市])/);
  if(m)$('f-district').value=m[1];
});
$('del').addEventListener('click',async function(){
  var d=$('del');
  if(d.dataset.armed!=='1'){ d.dataset.armed='1'; d.textContent='再按一次確認刪除'; return; }
  var id=editingId; closeEdit(); if(id){ await removeItem(id); setStatus('已刪除。'); }
});
$('editForm').addEventListener('submit',async function(e){
  e.preventDefault();
  var f=foods.find(function(x){return x.id===editingId}); if(!f)return;
  var c=clean({
    name:$('f-name').value, city:$('f-city').value, district:$('f-district').value, category:$('f-cat').value,
    address:$('f-address').value, recommend:$('f-rec').value, price:$('f-price').value,
    rating:$('f-rating').value, tags:$('f-tags').value, url:$('f-url').value
  });
  if(!c.name)return;
  var upd=Object.assign({},f,c);
  closeEdit(); await commit(upd);
});

/* ---------- backup ---------- */
function bkMsg(m,warn){ var p=$('bkMsg'); p.textContent=m||''; p.className=warn?'warn':''; }
function jsonText(){ return JSON.stringify(foods,null,1); }
$('bkDl').addEventListener('click',function(){
  var b=new Blob([jsonText()],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='shicang-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
  bkMsg('已下載 '+foods.length+' 間。');
});
$('bkCopy').addEventListener('click',async function(){
  var t=jsonText(), ok=false;
  try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){}
  if(!ok){ try{ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e){} }
  bkMsg(ok?'已複製 '+foods.length+' 間的 JSON 文字。':'複製失敗，請改用下載 JSON。',!ok);
});
function restore(text){
  var d; try{ d=JSON.parse(text); }catch(e){ bkMsg('JSON 格式不正確。',true); return false; }
  if(d&&!Array.isArray(d)&&Array.isArray(d.foods))d=d.foods;
  if(!Array.isArray(d)){ bkMsg('JSON 格式不正確。',true); return false; }
  var list=[]; d.forEach(function(x){ if(x&&x.name){ var c=clean(x); if(!c.name)return; c.id=str(x.id)||newId(); c.createdAt=x.createdAt||Date.now(); list.push(c); } });
  if(!list.length){ bkMsg('備份裡沒有店家資料。',true); return false; }
  var mode=(document.querySelector('input[name="rmode"]:checked')||{}).value;
  if(mode==='replace'){
    if(!confirm('覆蓋會取代目前的 '+foods.length+' 間，改成備份的 '+list.length+' 間。確定嗎？'))return false;
    foods=list; bkMsg('已覆蓋，共 '+foods.length+' 間。');
  }else{
    var ids={}, keys={}, n=0, skip=0;
    foods.forEach(function(f){ ids[f.id]=1; keys[f.name+'|'+f.district]=1; });
    list.forEach(function(f){ if(ids[f.id]||keys[f.name+'|'+f.district]){skip++;return;} ids[f.id]=1; keys[f.name+'|'+f.district]=1; foods.push(f); n++; });
    bkMsg('已合併：新增 '+n+' 間'+(skip?'，略過重複 '+skip+' 間':'')+'；現有資料保留。');
  }
  ui={city:'',district:'',cat:'',eat:'',q:''}; $('q').value=''; freshIds={};
  saveLocal(); render(); return true;
}
$('bkFile').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file)return; var r=new FileReader();
  r.onload=function(){ restore(String(r.result)); };
  r.onerror=function(){ bkMsg('讀取檔案失敗。',true); };
  r.readAsText(file); e.target.value='';
});
$('bkPasteGo').addEventListener('click',function(){
  var t=$('bkPaste').value.trim(); if(!t){ bkMsg('請先貼上 JSON 文字。',true); return; }
  if(restore(t))$('bkPaste').value='';
});

/* ---------- boot ---------- */
loadLocal(); setMode(); render();
})();
</script>

</body></html>
